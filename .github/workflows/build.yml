name: Build and Release GitVibe

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: git-vibe-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: git-vibe-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer and main bundles
        run: npm run build

      - name: Package and Publish Electron App
        # Only publish to GitHub Releases on push to main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
