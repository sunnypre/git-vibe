name: Build and Release GitVibe

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: git-vibe-desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: git-vibe-desktop/pnpm-lock.yaml

      - name: Set up Python (for node-gyp compatibility)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build renderer and main bundles
        run: pnpm run build

      - name: Package and Publish Electron App
        # Only publish to GitHub Releases on push to main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}