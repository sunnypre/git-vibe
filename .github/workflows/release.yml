name: Release GitVibe

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: git-vibe-windows-x64.zip
            binary_name: GitVibe.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: git-vibe-linux-x64.tar.gz
            binary_name: GitVibe
          - os: macos-latest
            rid: osx-x64
            artifact_name: git-vibe-macos-x64.tar.gz
            binary_name: GitVibe
          - os: macos-latest
            rid: osx-arm64
            artifact_name: git-vibe-macos-arm64.tar.gz
            binary_name: GitVibe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        run: dotnet publish -r ${{ matrix.rid }} -c Release -o ./publish

      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ./publish/${{ matrix.binary_name }} -DestinationPath ./${{ matrix.artifact_name }}
        shell: pwsh

      - name: Package Artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czvf ./${{ matrix.artifact_name }} -C ./publish ${{ matrix.binary_name }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ matrix.artifact_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
